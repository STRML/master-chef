name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 tools/check_repository_hygiene.py --strict
      - run: python3 tools/run_source_checks.py --portable-only
      - run: python3 tools/run_source_checks.py --portable-only --sanitize
