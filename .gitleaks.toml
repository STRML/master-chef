title = "Halo Vision source release"
[extend]
useDefault = true

# Two unmodified xxHash vector shifts look like key assignments to the generic
# detector. Match the exact expressions and file, not the whole vendor tree.
# Configuration: https://github.com/gitleaks/gitleaks/blob/v8.30.1/README.md
[[allowlists]]
description = "xxHash AVX512 arithmetic, not credentials"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)native/EngineHost/third_party/xxhash/xxhash\.h$''']
regexes = ['''^\s*__m512i const data_key_(lo|hi) = _mm512_srli_epi64 \(data_key, 32\);\s*$''']
